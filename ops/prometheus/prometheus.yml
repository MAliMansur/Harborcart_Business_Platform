global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: harborcart
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    scrape_timeout: 5s
    static_configs:
      - targets: ["web:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
# Local alerts appear in Prometheus /alerts. No external receiver is configured.
