name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/preflight.py
      - run: python scripts/bootstrap.py
      - run: make check test
      - run: python scripts/smoke_http.py
      - run: node --check static/app.js
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: hc_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: harborcart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hc_ci -d harborcart"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://hc_ci:ephemeral-ci-only@127.0.0.1:5432/harborcart
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python manage.py test commerce.tests --settings=harbor.settings_test --noinput --verbosity=2
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes -r requirements-security.lock
      - run: bandit -r commerce harbor scripts -x commerce/tests,harbor/settings_test.py -c bandit.toml
      - run: pip-audit --require-hashes -r requirements.lock
      - run: python scripts/check_repository.py
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - run: python3 scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d db migrate web worker
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: docker compose exec -T web python manage.py seed_demo
      - run: docker compose --profile tests run --rm tests
      - run: docker compose exec -T web python manage.py reconcile
      - if: always()
        run: docker compose down
